name: Project status automation

on:
  create:
  pull_request:
    types: [opened, reopened, closed]

permissions:
  contents: read

# One writer for replacement-style field updates; never cancel an active repair.
concurrency:
  group: budgetapp-project-status
  queue: max
  cancel-in-progress: false

jobs:
  update-project-status:
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Same-repository PRs only; forks never execute code with PROJECT_TOKEN.
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Repair canonical statuses and update linked issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { syncProjectStatus } = require('./.github/scripts/project-status.cjs');
            await syncProjectStatus({ github, context, core });
