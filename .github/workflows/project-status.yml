name: Project status automation

on:
  workflow_run:
    workflows: [Project branch created]
    types: [completed]
    branches: ['issue-*']
  pull_request_target:
    types: [opened, reopened, closed]

permissions:
  contents: read

# One writer for replacement-style field updates; never cancel an active repair.
concurrency:
  group: budgetapp-project-status
  queue: max
  cancel-in-progress: false

jobs:
  update-project-status:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'create' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: project-automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Both triggers resolve github.sha from the trusted default branch.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repair canonical statuses and update linked issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { syncProjectStatus } = require('./.github/scripts/project-status.cjs');
            await syncProjectStatus({ github, context, core });
