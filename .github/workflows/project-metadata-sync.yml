name: Sync issue metadata to project

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue into BudgetApp project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = 'Tzahile';
            const projectTitle = 'BudgetApp';
            const body = context.payload.issue.body || '';
            const issueId = context.payload.issue.node_id;

            const readMeta = (name) => {
              const m = body.match(new RegExp(`\\*\\*${name}:\\*\\*\\s*([^\\n\\r]+)`, 'i'));
              return m ? m[1].trim() : null;
            };

            const desired = {
              Priority: readMeta('Priority'),
              Area: readMeta('Area'),
              Effort: readMeta('Effort'),
            };

            const result = await github.graphql(`
              query($login: String!, $issueId: ID!) {
                user(login: $login) {
                  projectsV2(first: 100) {
                    nodes {
                      id
                      title
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 100) {
                      nodes { id project { id title } }
                    }
                  }
                }
              }
            `, { login: owner, issueId });

            const project = result.user?.projectsV2?.nodes?.find(p => p.title === projectTitle);
            if (!project) {
              core.setFailed(`Project '${owner}/${projectTitle}' not found.`);
              return;
            }

            let item = result.node?.projectItems?.nodes?.find(i => i.project.id === project.id);
            const isNewItem = !item;

            if (!item) {
              const added = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId: project.id, contentId: issueId });
              item = added.addProjectV2ItemById.item;
            }

            const setSelect = async (fieldName, optionName) => {
              if (!optionName) return;
              const field = project.fields.nodes.find(f => f?.name === fieldName);
              if (!field) {
                core.warning(`Field '${fieldName}' not found.`);
                return;
              }
              const option = field.options.find(o => o.name === optionName);
              if (!option) {
                core.warning(`Option '${optionName}' not found in '${fieldName}'.`);
                return;
              }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, {
                projectId: project.id,
                itemId: item.id,
                fieldId: field.id,
                optionId: option.id,
              });
            };

            await setSelect('Priority', desired.Priority);
            await setSelect('Area', desired.Area);
            await setSelect('Effort', desired.Effort);
            if (isNewItem) await setSelect('Status', 'Backlog');

            core.info(`Synced issue #${context.payload.issue.number} to ${projectTitle}.`);
