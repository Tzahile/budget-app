name: Test and deploy to Val Town

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-to-val-town
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run check

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Val Town modules
        run: deno check --no-lock --allow-import=esm.town,esm.sh index.http.ts frontend/index.tsx

      - name: Install vt CLI
        run: deno install -gArf jsr:@valtown/vt@0.1.56

      - name: Bootstrap Val Town project
        if: ${{ hashFiles('.vt/state.json') == '' }}
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: |
          vt create budget-app "$RUNNER_TEMP/budget-app-val" --public --no-editor-files --org-name me
          mkdir -p .vt
          cp "$RUNNER_TEMP/budget-app-val/.vt/state.json" .vt/state.json
          echo "VT_BOOTSTRAPPED=1" >> "$GITHUB_ENV"

      - name: Push to Val Town
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: vt push

      - name: Ensure HTTP trigger and remove ignored remote files
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: |
          VAL_ID=$(jq -r '.val.id' .vt/state.json)
          BRANCH_ID=$(jq -r '.branch.id' .vt/state.json)
          API="https://api.val.town/v2/vals/$VAL_ID/files"

          for path in .gitignore README.md ROADMAP.md deno.lock index.ts types; do
            curl --silent --show-error --request DELETE \
              --header "Authorization: Bearer $VAL_TOWN_API_KEY" \
              "$API?path=$path&recursive=true&branch_id=$BRANCH_ID" >/dev/null
          done

          curl --fail-with-body --silent --show-error --request PUT \
            --header "Authorization: Bearer $VAL_TOWN_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"type":"http"}' \
            "$API?path=index.http.ts&branch_id=$BRANCH_ID" >/dev/null

      - name: Persist Val Town project identity
        if: env.VT_BOOTSTRAPPED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vt/state.json
          git commit -m "chore: record Val Town project identity"
          git push
