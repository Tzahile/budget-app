name: Test and deploy to Val Town

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-to-val-town
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run check

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Val Town modules
        run: deno check --allow-import=esm.town,esm.sh index.ts frontend/index.tsx

      - name: Install vt CLI
        run: deno install -gArf jsr:@valtown/vt@0.1.56

      - name: Bootstrap Val Town project
        if: ${{ hashFiles('.vt/state.json') == '' }}
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: |
          vt create budget-app "$RUNNER_TEMP/budget-app-val" --private --no-editor-files --org-name me
          mkdir -p .vt
          cp "$RUNNER_TEMP/budget-app-val/.vt/state.json" .vt/state.json
          echo "VT_BOOTSTRAPPED=1" >> "$GITHUB_ENV"

      - name: Push to Val Town
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: vt push

      - name: Persist Val Town project identity
        if: env.VT_BOOTSTRAPPED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vt/state.json
          git commit -m "chore: record Val Town project identity"
          git push
